onboarding = false

[keys]
switch_workspace = "prefix+alt+1..9"
next_workspace = "prefix+down"
previous_workspace = "prefix+up"
focus_agent = "prefix+shift+1..9"

[ui.sidebar.agents]
rows = [
  [{ token = "$idx", fg = "#a6adc8" }, "state_icon", "workspace", "agent"],
  [{ token = "tab", fg = "#a6adc8" }],
]

[ui.sidebar.agents.rows_by_agent]
claude = [
  [{ token = "$idx", fg = "#a6adc8" }, "state_icon", "workspace", "agent"],
  [{ token = "terminal_title_stripped", fg = "#a6adc8" }],
]
